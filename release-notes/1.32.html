<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>抬头日历 1.32</title></head><body>
<h2>抬头日历 1.32</h2>
<p>在「桌面小组件设置 → 日期库」点「日期库另存为…」，即可把现有日期存到自己选的文件夹。以后添加、修改或删除日期，都会直接写入这里。</p>
<p>文件夹可以放在 iCloud 云盘。等云盘同步后，在另一台 Mac 点「打开已有库…」，选择同一个文件夹即可。小组件显示主应用最近读到的日期。</p>
<p>升级会沿用原日期库。需要保留历史版本时，可在「备份与恢复」中设置。</p>
</body></html>
