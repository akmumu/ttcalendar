<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        body {
            font: -apple-system-body;
            font-family: -apple-system, "PingFang SC", sans-serif;
            color: #1d1d1f;
            margin: 0;
            padding: 4px 2px;
            line-height: 1.5;
        }
        h2 { font-size: 15px; margin: 0 0 8px; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 6px; }
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            padding: 0 5px;
            margin-right: 4px;
            color: #fff;
        }
        .new { background: #8a5cf6; }
        .fix { background: #34c759; }
        .imp { background: #007aff; }
        @media (prefers-color-scheme: dark) {
            body { color: #f5f5f7; }
        }
    </style>
</head>
<body>
    <h2>抬头日历 1.17</h2>
    <ul>
        <li><span class="tag imp">优化</span>主应用右上角新增轻量版本与检查更新入口，正文不再单独占用版本信息区域。</li>
        <li><span class="tag imp">优化</span>重排小组件排查流程，把日历权限、节假日日历和手动刷新合并为三步修复。</li>
        <li><span class="tag new">新增</span>主应用提供一键强制刷新小组件能力，方便排查桌面小组件缓存问题。</li>
        <li><span class="tag fix">修复</span>继续强化小组件刷新标记，帮助 WidgetKit 更稳定地替换旧视图。</li>
    </ul>
</body>
</html>
