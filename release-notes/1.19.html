<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        body {
            font: -apple-system-body;
            font-family: -apple-system, "PingFang SC", sans-serif;
            color: #1d1d1f;
            margin: 0;
            padding: 4px 2px;
            line-height: 1.5;
        }
        h2 { font-size: 15px; margin: 0 0 8px; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 6px; }
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            padding: 0 5px;
            margin-right: 4px;
            color: #fff;
        }
        .new { background: #8a5cf6; }
        .fix { background: #34c759; }
        .imp { background: #007aff; }
        @media (prefers-color-scheme: dark) {
            body { color: #f5f5f7; }
        }
    </style>
</head>
<body>
    <h2>抬头日历 1.19</h2>
    <ul>
        <li><span class="tag fix">修复</span>补齐 Sparkle 在沙盒环境下安装更新所需的通信权限。</li>
        <li><span class="tag fix">修复</span>更新弹窗发布说明显示旧版本内容的问题。</li>
        <li><span class="tag fix">修复</span>主应用和小组件在深色模式下的颜色异常。</li>
        <li><span class="tag imp">优化</span>打包脚本会展开签名 entitlements 中的 bundle id 占位符。</li>
    </ul>
</body>
</html>
