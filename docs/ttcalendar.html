<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        body {
            font: -apple-system-body;
            font-family: -apple-system, "PingFang SC", sans-serif;
            color: #1d1d1f;
            margin: 0;
            padding: 4px 2px;
            line-height: 1.5;
        }
        h2 { font-size: 15px; margin: 0 0 8px; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 6px; }
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            padding: 0 5px;
            margin-right: 4px;
            color: #fff;
        }
        .new { background: #8a5cf6; }
        .fix { background: #34c759; }
        .imp { background: #007aff; }
        @media (prefers-color-scheme: dark) {
            body { color: #f5f5f7; }
        }
    </style>
</head>
<body>
    <h2>抬头日历 1.23</h2>
    <ul>
        <li><span class="tag fix">修复</span>免证书 DMG 安装后，小组件无法读取节假日及调休数据。</li>
        <li><span class="tag imp">优化</span>假期、自定义日期和月份状态改用小组件自身容器共享，不再依赖 App Group。</li>
        <li><span class="tag imp">优化</span>主应用迁移旧缓存，数据访问被拒绝时提供明确提示。</li>
        <li><span class="tag imp">首次运行</span>请允许打开应用，并授权日历及小组件数据访问，无需关闭系统安全保护。</li>
        <li><span class="tag imp">升级提示</span>使用旧更新密钥的版本需手动安装一次；保留新更新密钥的 1.22 可继续检查更新。</li>
    </ul>
</body>
</html>
