<!DOCTYPE html>

<head><meta charset="utf-8"><title>抬头日历 1.26</title></head>
<body>
    <h2>抬头日历 1.26</h2>
    <ul>
        <li>新增程序员节（10 月 24 日）、万圣节（按 10 月 31 日活动日期显示）和光棍节（11 月 11 日）。</li>
        <li>新增感恩节，按每年 11 月第四个星期四计算，2026 年为 11 月 26 日。</li>
        <li>保留圣诞节（12 月 25 日），将农历腊月初八的名称补全为“腊八节”。</li>
        <li>新增节日同时用于月历标签和近期节日倒计时，不额外标记为法定休假日。</li>
    </ul>
    <p>若小组件停在灰色占位画面，可先在主应用中刷新；仍未恢复时，可重启系统小组件宿主。更新后若日历权限显示“待授权”，请在应用中重新授权以继续同步 Apple 日历，已有缓存和自定义日期保留。</p>
</body>
</html>
