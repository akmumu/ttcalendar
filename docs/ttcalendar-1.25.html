<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>抬头日历 1.25</title></head>
<body>
    <h2>抬头日历 1.25</h2>
    <ul>
        <li>新增自定义日期通知提醒，默认关闭，可选择当天或提前 1、3、7 天，并设置提醒时间。</li>
        <li>提前提醒时可以同时保留当天提醒；保存时申请系统通知权限，授权后无需保持应用运行。</li>
        <li>编辑、关闭提醒或删除日期时同步更新通知；权限未开启或通知安排失败时提供提示。</li>
        <li>支持普通年度日期重复提醒，正确处理跨年及闰日。闰日相关提醒预排未来 8 年，打开应用时续排。</li>
        <li>修复非闰年编辑 2 月 29 日生日时可能变成 3 月 1 日的问题。</li>
    </ul>
    <p>更新后，在“添加日期”或“编辑特殊日期”的“提醒”区域开启。实际通知展示受 macOS 通知设置和专注模式影响。</p>
</body>
</html>
