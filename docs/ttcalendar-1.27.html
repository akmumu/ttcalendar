<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>抬头日历 1.27</title></head>
<body>
<h2>抬头日历 1.27</h2>
<ul>
<li>修复手动刷新小组件时因辅助文件写入失败而出现的误导性授权提示；刷新请求不再依赖该文件写入。</li>
<li>手动刷新与应用启动共用短间隔重试，连续点击时取消上一组未执行的重试。</li>
<li>保留未来 8 天日历内容，并请求系统每小时重新生成时间线，改善旧内容长时间不更新的情况。</li>
<li>节假日缓存写入失败时保留真实错误，不再被后续辅助写入误报为同步成功。</li>
</ul>
<p>内置节日无需日历授权。实际刷新时间仍由 macOS 决定，不能保证点击后立即生效或严格每小时刷新。若升级后仍显示旧内容，可点击小组件上的“回到本月”，或移除后重新添加。</p>
</body>
</html>
