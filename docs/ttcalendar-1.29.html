<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>抬头日历 1.29</title></head>
<body>
<h2>抬头日历 1.29</h2>
<ul>
<li>主应用和小组件增加“重启小组件”入口，结束自身的小组件进程并请求系统重新加载，保留自定义日期。</li>
<li>设置增加“重启系统小组件服务”备用入口，确认后短暂重载所有桌面小组件与通知中心。</li>
<li>增加自动检查更新开关；主应用和小组件均可检查新版本，检查间隔至少六小时。</li>
<li>发现新版本时，主应用显示版本提示、Dock 显示“新”，小组件顶部显示橙色下载标记，点击可打开更新窗口。</li>
<li>支持跳过版本、升级后清除旧标记，以及离线保留检查结果。</li>
</ul>
<p>小组件由 macOS 调度刷新，更新标记不保证实时出现。小组件卡住时，请从主应用侧栏使用“重启小组件”。</p>
</body>
</html>
